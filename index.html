<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Quiz Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1230; --bg2:#171B4A; --card:#1D2159; --card2:#252B6B;
  --accent:#FFC145; --accent2:#3FDDC0; --danger:#FF5D73; --success:#4ADE80;
  --text:#F2F0FB; --text-dim:#A9AEDC; --border:#31367A;
  --shadow: 0 10px 30px rgba(5,6,25,0.45);
  --radius:20px; --radius-sm:12px;
}
:root[data-mode="light"]{
  --bg:#F3F1FB; --bg2:#EAE7FA; --card:#FFFFFF; --card2:#F2F0FF;
  --text:#1C1F3B; --text-dim:#5C6099; --border:#DEDBF5;
  --shadow: 0 10px 24px rgba(90,80,180,0.14);
}
@media (prefers-color-scheme: light){
  :root:not([data-mode="dark"]){
    --bg:#F3F1FB; --bg2:#EAE7FA; --card:#FFFFFF; --card2:#F2F0FF;
    --text:#1C1F3B; --text-dim:#5C6099; --border:#DEDBF5;
    --shadow: 0 10px 24px rgba(90,80,180,0.14);
  }
}
:root[data-vtheme="ocean"]{ --accent:#3FC1FF; --accent2:#00E0C7; }
:root[data-vtheme="space"]{ --accent:#B388FF; --accent2:#FF6EC7; }
:root[data-vtheme="nature"]{ --accent:#8BD450; --accent2:#FFD166; }
:root[data-vtheme="neon"]{ --accent:#FF2E92; --accent2:#00F0FF; }
:root[data-vtheme="minimal"]{ --accent:#5C6099; --accent2:#9AA0D8; }
:root[data-vtheme="sunset"]{ --accent:#FF8A5B; --accent2:#FFC94A; }
:root[data-vtheme="royal"]{ --accent:#B68CFF; --accent2:#FFC145; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 15% -10%, var(--bg2), var(--bg) 60%);
  color:var(--text); font-family:'Manrope',sans-serif; min-height:100vh;
  overscroll-behavior:none;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
#root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:28px;}
#root.has-tabbar{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px));}
.tabbar{
  position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px;
  display:flex; background:var(--card); border-top:1px solid var(--border);
  box-shadow:0 -6px 20px rgba(5,6,25,0.25);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:40;
}
.tabbar-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; padding:4px 0; border-radius:12px; color:var(--text-dim);}
.tabbar-item:active{transform:scale(.93);}
.tabbar-item.active{color:var(--text);}
.tabbar-item .ti-icon{font-size:21px; line-height:1;}
.tabbar-item.active .ti-icon{transform:scale(1.08);}
.tabbar-item .ti-label{font-size:10.5px; font-weight:700;}
.tabbar-item.active .ti-label{color:var(--accent2);}
.screen{padding:18px 16px 8px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;}
.iconbtn{background:var(--card);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:var(--shadow);}
.iconbtn:active{transform:scale(0.94);}
.topbar h2{margin:0;font-size:19px;flex:1;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;justify-content:space-between;}
.pill{background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);}
.btn{border:none;border-radius:14px;padding:13px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;cursor:pointer;transition:transform .12s ease;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111230;}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-block{width:100%;}
.btn-danger{background:var(--danger);color:#2a0c14;}
.small{font-size:12.5px;color:var(--text-dim);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.spacer{height:14px;}
.progressbar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--border);}
.progressbar > div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.badge{font-size:11px;font-weight:800;background:var(--card2);padding:3px 8px;border-radius:8px;color:var(--text-dim);}
.hero-title{font-size:26px;font-weight:800;margin:0;}
.section-title{font-size:15px;font-weight:800;margin:18px 0 10px;color:var(--text-dim);letter-spacing:.2px;}
.emptystate{text-align:center;padding:36px 16px;color:var(--text-dim);}
.emptystate .em{font-size:42px;display:block;margin-bottom:8px;}
.modal-bg{position:fixed;inset:0;background:rgba(4,5,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
:root[data-mode="light"] .modal-bg{background:rgba(40,30,80,.35);}
.modal{background:var(--card);border-radius:22px 22px 0 0;padding:22px 18px 26px;width:100%;max-width:480px;box-shadow:0 -12px 30px rgba(0,0,0,.3);animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;}}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-family:monospace;font-size:12px;min-height:110px;}

/* Home */
.home-header{display:flex;align-items:center;gap:12px;}
.avatar{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.avatar.frame-bronze{box-shadow:0 0 0 3px #CD7F32, 0 0 10px rgba(205,127,50,.5);}
.avatar.frame-silver{box-shadow:0 0 0 3px #C9CDD6, 0 0 10px rgba(201,205,214,.6);}
.avatar.frame-gold{box-shadow:0 0 0 3px #FFD700, 0 0 12px rgba(255,215,0,.6);}
.stat-strip{display:flex;gap:8px;margin-top:14px;}
.stat-chip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--shadow);}
.stat-chip .v{font-family:'Baloo 2';font-weight:800;font-size:17px;}
.stat-chip .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
.hero-card{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;padding:16px 18px;color:#111230;cursor:pointer;box-shadow:var(--shadow);}
.hero-card:active{transform:scale(.98);}
.hc-label{font-size:11px;font-weight:800;letter-spacing:.6px;opacity:.75;margin-bottom:6px;}
.hc-main{display:flex;align-items:center;gap:12px;}
.hc-icon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.hc-title{font-family:'Baloo 2';font-weight:800;font-size:17px;}
.hc-sub{font-size:12px;opacity:.8;font-weight:600;margin-top:1px;}
.hc-play{width:38px;height:38px;border-radius:50%;background:rgba(17,18,48,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}

.daily-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);cursor:pointer;position:relative;}
.daily-card:active{transform:scale(.97);}
.daily-card .dc-icon{font-size:22px;margin-bottom:4px;}
.daily-card .dc-title{font-weight:800;font-size:13px;font-family:'Baloo 2';}
.daily-card .dc-sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
.daily-card .dc-dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(255,93,115,.2);}

.ring{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:3px;}
.ring-inner{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:inset 0 0 0 1px var(--border);}

.profile-row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px;cursor:pointer;}
.profile-row:active{transform:scale(.98);}
.profile-row .pr-icon{font-size:20px;width:34px;text-align:center;}
.profile-row .pr-label{flex:1;font-weight:700;font-size:14px;}
.profile-row .pr-chevron{color:var(--text-dim);font-size:18px;}

.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;}
.menu-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
.menu-item:active{transform:scale(.95);}
.menu-item .em{font-size:22px;display:block;margin-bottom:4px;}
.menu-item .lb{font-size:11px;font-weight:700;}

/* Category cards */
.cat-card{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.cat-card:active{transform:scale(.98);}
.cat-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.cat-info{flex:1;min-width:0;}
.cat-info .name{font-weight:800;font-family:'Baloo 2';font-size:16px;}
.cat-info .meta{font-size:12px;color:var(--text-dim);margin:3px 0 6px;}

/* Levels grid */
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px;}
.level-cell{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-family:'Baloo 2';font-size:14px;cursor:pointer;position:relative;border:1px solid var(--border);}
.level-cell.locked{background:var(--card2);color:var(--text-dim);cursor:default;}
.level-cell.unlocked{background:var(--card);color:var(--text);}
.level-cell.current{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111230;}
.level-cell .stars{position:absolute;bottom:3px;font-size:8px;letter-spacing:1px;}
.level-cell:active{transform:scale(.93);}

/* Quiz */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.timer-ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:3px solid var(--card2);}
.qcounter{font-size:13px;color:var(--text-dim);font-weight:700;}
.question-card{padding:22px 18px;margin-top:6px;}
.question-text{font-size:19px;font-weight:700;line-height:1.4;font-family:'Baloo 2';}
.option{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;font-family:'Manrope';}
.option:active{transform:scale(.98);}
.option.correct{background:rgba(74,222,128,.18);border-color:var(--success);color:var(--success);}
.option.wrong{background:rgba(255,93,115,.18);border-color:var(--danger);color:var(--danger);}
.option.disabled-opt{opacity:.35;pointer-events:none;}
.powerup-row{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px;}
.pw-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;min-width:58px;}
.pw-btn .n{font-size:18px;display:block;}
.pw-btn:active{transform:scale(.93);}
.explain-box{margin-top:12px;padding:12px 14px;background:var(--card2);border-radius:12px;font-size:13px;color:var(--text-dim);border-left:3px solid var(--accent);}

/* Result */
.result-hero{text-align:center;padding:26px 10px 10px;}
.stars-big{font-size:34px;letter-spacing:6px;margin:8px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.result-stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center;}
.result-stat .v{font-family:'Baloo 2';font-weight:800;font-size:20px;}
.result-stat .l{font-size:11px;color:var(--text-dim);}
.unlock-banner{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111230;border-radius:14px;padding:10px 14px;font-weight:800;text-align:center;margin-top:12px;font-family:'Baloo 2';}

/* Store */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tab{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111230;border-color:transparent;}
.store-item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;}
.store-item .em{font-size:26px;width:42px;text-align:center;}
.store-item .info{flex:1;min-width:0;}
.store-item .info .n{font-weight:800;font-size:14px;}
.store-item .info .d{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
.buy-btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;}
.buy-btn:active{transform:scale(.93);}

/* Achievements */
.ach-item{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px;}
.ach-item.locked{opacity:.45;}
.ach-icon{font-size:24px;width:40px;text-align:center;}
.ach-item .n{font-weight:800;font-size:14px;}
.ach-item .d{font-size:11.5px;color:var(--text-dim);}

/* Settings */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.switch{width:46px;height:26px;border-radius:99px;background:var(--card2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease;}
.switch.on .knob{left:22px;}
.theme-swatch{width:100%;aspect-ratio:1.6;border-radius:14px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.theme-swatch.active{border-color:var(--accent);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:700;font-size:13.5px;z-index:80;animation:toastIn .25s ease;max-width:88%;text-align:center;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);} to{opacity:1;transform:translate(-50%,0);}}

.confetti-pop{position:fixed;inset:0;pointer-events:none;z-index:60;}
</style>
</head>

<script>

  if(m<=20) return 'beginner';
  if(m<=40) return 'easy';
  if(m<=60) return 'intermediate';

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h; }
function shuffle(arr, rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00'); return Math.round((d2-d1)/86400000); }

function poolForLevel(catId, tier){
  const idx = TIERS.indexOf(tier);
  const neighborIdx = idx < TIERS.length-1 ? idx+1 : idx-1;
  const neighborTier = TIERS[neighborIdx];
  return BANK[catId][tier].concat(BANK[catId][neighborTier]);
}

function randInt(rng,min,max){ return min + Math.floor(rng()*(max-min+1)); }
function factorialOf(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function makeNumOptions(rng, correct, genWrongFn){
  const seen = new Set([correct]);
  const wrongs = [];
  let guard=0;
  while(wrongs.length<3 && guard<200){
    guard++;
    const w = genWrongFn();
    if(!seen.has(w)){ seen.add(w); wrongs.push(w); }
  }
  while(wrongs.length<3){ wrongs.push(correct + wrongs.length + 1 + guard); guard++; }
  const all = shuffle([correct, ...wrongs], rng);
  return {options: all.map(v=>String(v)), correct: all.indexOf(correct)};
}

    (rng)=>{ const l=randInt(rng,3,20), w=randInt(rng,3,20); const c=l*w;
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,c+randInt(rng,-15,15)||c+5));
      return {text:`What is the area of a rectangle with length ${l} and width ${w}?`, options, correct, explanation:`Area = length × width = ${c}.`}; },
    (rng)=>{ const n=randInt(rng,2,20); const val=n*n;
      const {options,correct}=makeNumOptions(rng,n,()=>Math.max(1,n+randInt(rng,-4,4)||n+1));
      return {text:`What is √${val}?`, options, correct, explanation:`√${val} = ${n}.`}; },
    (rng)=>{ const n=randInt(rng,3,7); const c=factorialOf(n);
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,c+randInt(rng,-c*0.4,c*0.4)|| c+3));
      return {text:`What is ${n} factorial (${n}!)?`, options, correct, explanation:`${n}! = ${c}.`}; },
    (rng)=>{ const sides=randInt(rng,5,10); const c=(sides-2)*180;
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(90,c+randInt(rng,-2,2)*180||c+180));
      return {text:`What is the sum of interior angles of a polygon with ${sides} sides?`, options, correct, explanation:`Sum = (n-2)×180° = ${c}°.`}; }
  ],
  hard: [
    (rng)=>{ const x=randInt(rng,2,12); const k=x*x;
      const {options,correct}=makeNumOptions(rng,x,()=>Math.max(1,x+randInt(rng,-4,4)||x+1));
      return {text:`Solve: x² = ${k} (x > 0)`, options, correct, explanation:`x = √${k} = ${x}.`}; },
    (rng)=>{ const triples=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25]]; const t=triples[randInt(rng,0,triples.length-1)]; const m=randInt(rng,1,3);
      const a=t[0]*m,b=t[1]*m,c=t[2]*m;
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,c+randInt(rng,-6,6)||c+2));
      return {text:`What is the hypotenuse of a right triangle with legs ${a} and ${b}?`, options, correct, explanation:`By the Pythagorean theorem, the hypotenuse is ${c}.`}; },
    (rng)=>{ const e=randInt(rng,2,12); const c=Math.pow(2,e);
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,Math.round(c*(0.5+rng()))|| c+4));
      return {text:`What is 2^${e}?`, options, correct, explanation:`2^${e} = ${c}.`}; },
    (rng)=>{ const s=randInt(rng,2,10); const c=s*s*s;
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,c+randInt(rng,-20,20)||c+8));
      return {text:`What is the volume of a cube with side ${s}?`, options, correct, explanation:`Volume = side³ = ${c}.`}; }
  ],
  expert: [
    (rng)=>{ const base=[2,3,4][randInt(rng,0,2)]; const e=randInt(rng,3,6); const c=Math.pow(base,e);
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,Math.round(c*(0.5+rng()*1.2))||c+5));
      return {text:`What is ${base}^${e}?`, options, correct, explanation:`${base}^${e} = ${c}.`}; },
    (rng)=>{ const e=randInt(rng,1,6); const val=Math.pow(10,e);
      const {options,correct}=makeNumOptions(rng,e,()=>Math.max(0,e+randInt(rng,-3,3)||e+1));
      return {text:`What is log₁₀(${val})?`, options, correct, explanation:`log₁₀(${val}) = ${e}.`}; },
    (rng)=>{ const n=randInt(rng,4,7), r=randInt(rng,2,3); const c=Math.round(factorialOf(n)/factorialOf(n-r));
      const {options,correct}=makeNumOptions(rng,c,()=>Math.max(1,c+randInt(rng,-8,8)||c+3));
      return {text:`How many ways can you arrange ${r} items chosen from ${n} distinct items (nPr)?`, options, correct, explanation:`nPr = ${n}!/(${n}-${r})! = ${c}.`}; },
    (rng)=>{ const e=randInt(rng,1,50); const m=e%4; const labels=['1','i','-1','-i']; const correctLabel = labels[m];
      const all = shuffle(labels.slice(), rng); const correct = all.indexOf(correctLabel);
      return {text:`What is i^${e}? (i is the imaginary unit)`, options:all, correct, explanation:`Powers of i cycle every 4: i^${e} = ${correctLabel}.`}; }
  ]
};
function generateMathLevelQuestions(level){
  const tier = tierForLevel(level);
  const gens = MATH_GENERATORS[tier];
  const qs = [];
  const usedTexts = new Set();
  for(let i=0;i<10;i++){
    let q, guard=0, seedBase = hashStr('math_'+level+'_'+i+'_'+tier);
    do{
      const rng = mulberry32(seedBase + guard*104729 + i*7919);
      const gen = gens[Math.floor(rng()*gens.length)];
      q = gen(rng);
      guard++;
    } while(usedTexts.has(q.text) && guard<40);
    usedTexts.add(q.text);
    q.tier = tier;
    qs.push(q);
  }
  return qs;
}

function generateLevelQuestions(catId, level){
  if(catId==='math') return generateMathLevelQuestions(level);
  const tier = tierForLevel(level);
  const pool = poolForLevel(catId, tier);
  const seed = hashStr(catId+'_'+level+'_'+tier);
  const rng = mulberry32(seed);
  const shuffledPool = shuffle(pool, rng);
  const qs = [];
  const count = Math.min(10, shuffledPool.length);
  for(let i=0;i<count;i++){
    const src = shuffledPool[i];
    const qrng = mulberry32(seed + i*97 + 13);
    const optIdx = [0,1,2,3];
    const shuffledIdx = shuffle(optIdx, qrng);
    const options = shuffledIdx.map(idx=>src[1][idx]);
    const correct = shuffledIdx.indexOf(src[2]);
    qs.push({text:src[0], options, correct, explanation:src[3], tier});
  }
  return qs;
}

let STATE = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ STATE = defaultState(); saveState(); return; }
    const parsed = JSON.parse(raw);
    STATE = mergeDefaults(defaultState(), parsed);
    validateState(STATE);
  }catch(e){
    console.error('Failed to load state, starting fresh', e);
    STATE = defaultState();
    saveState();
  }
}
function mergeDefaults(def, loaded){
  const out = JSON.parse(JSON.stringify(def));
  for(const k in loaded){
    if(typeof loaded[k]==='object' && loaded[k]!==null && !Array.isArray(loaded[k]) && out[k] && typeof out[k]==='object'){
      out[k] = Object.assign({}, out[k], loaded[k]);
    } else if(loaded[k]!==undefined){
      out[k] = loaded[k];
    }
  }
  CATEGORIES.forEach(c=>{ if(!out.progress[c.id]) out.progress[c.id]={unlockedLevel:1, levels:{}}; });
  return out;
}
function validateState(s){
  s.coins = clampMin0(Math.floor(s.coins)||0);
  s.player.xp = clampMin0(Math.floor(s.player.xp)||0);
  for(const k in s.inventory){ s.inventory[k] = clampMin0(Math.floor(s.inventory[k])||0); }
  CATEGORIES.forEach(c=>{
    const p = s.progress[c.id];
    if(!p.unlockedLevel || p.unlockedLevel<1) p.unlockedLevel=1;
    if(p.unlockedLevel>100) p.unlockedLevel=100;
  });
}
let saveTimer=null;
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.error('Save failed', e); }
}

let actx=null;
function beep(freq,dur,type){
  if(!STATE.settings.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

function checkAchievements(){
  let unlocked=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achievements[a.id] && a.check(STATE)){
      STATE.achievements[a.id] = {unlocked:true, date:todayStr()};
      STATE.coins += a.reward;
      STATE.stats.totalCoinsEarned += a.reward;
      unlocked.push(a);
    }
  });
  if(unlocked.length){
    saveState();
    unlocked.forEach((a,i)=>{
      setTimeout(()=>{ SND.achieve(); showToast('🏆 Achievement: '+a.name+' (+'+a.reward+' coins)'); }, i*900);
    });
  }
  return unlocked;
}

function processLogin(){
  const today = todayStr();
  if(STATE.loginStreak.lastLogin === today) return;
  if(STATE.loginStreak.lastLogin){
    const gap = daysBetween(STATE.loginStreak.lastLogin, today);
    if(gap===1){ STATE.loginStreak.current += 1; }
    else if(gap>1){
      if(STATE.inventory.streaksaver>0 && gap===2){ STATE.inventory.streaksaver -= 1; showToast('🛡️ Streak Saver used — streak protected!'); }
      else { STATE.loginStreak.current = 1; }
    }
  } else {
    STATE.loginStreak.current = 1;
  }
  STATE.loginStreak.lastLogin = today;
  if(STATE.loginStreak.current > STATE.loginStreak.longest) STATE.loginStreak.longest = STATE.loginStreak.current;
  saveState();
}

  if(QZ.xpBoostActive){ STATE.inventory.xpboost -= 1; saveState(); }
  loadQuestion();
}
function loadQuestion(){
  const q = QZ.questions[QZ.idx];
  QZ.timeLimitBase = TIER_TIME[q.tier];
  QZ.timeLeft = QZ.timeLimitBase;
  QZ.answered=false; QZ.fiftyUsedThisQ=false; QZ.hintUsedThisQ=false; QZ.secondChanceUsedThisQ=false;
  QZ.hiddenOptions = [];
  QZ.frozen=false;
  renderQuizQuestion();
  startTimer();
}
function startTimer(){
  clearInterval(QZ.timer);
  QZ.timer = setInterval(()=>{
    if(QZ.frozen) return;
    QZ.timeLeft -= 1;
    updateTimerUI();
    if(QZ.timeLeft<=0){
      clearInterval(QZ.timer);
      handleTimeout();
    }
  },1000);
}
function updateTimerUI(){
  const el = document.getElementById('timer-num');
  if(el) el.textContent = QZ.timeLeft;
  const ring = document.getElementById('timer-ring');
  if(ring){
    const pct = QZ.timeLeft/QZ.timeLimitBase;
    ring.style.borderColor = pct<0.25 ? 'var(--danger)' : 'var(--card2)';
  }
}
function renderQuizQuestion(){
  const q = QZ.questions[QZ.idx];
  const c = QZ.catId==='daily' ? {name:'Daily Challenge'} : CATEGORIES.find(x=>x.id===QZ.catId);
  let optsHtml = q.options.map((opt,i)=>{
    if(QZ.hiddenOptions.includes(i)) return `<button class="option disabled-opt" style="visibility:hidden;"></button>`;
    return `<button class="option" data-i="${i}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</button>`;
  }).join('');
  const pwRow = Object.keys(POWERUPS).map(k=>{
    const qty = STATE.inventory[k]||0;
    return `<div class="pw-btn" onclick="usePowerup('${k}')" style="${qty<=0?'opacity:.35;pointer-events:none;':''}"><span class="n">${POWERUPS[k].icon}</span>${POWERUPS[k].name}<div class="small">×${qty}</div></div>`;
  }).join('');
  const html = `
  <div class="screen">
    <div class="topbar" style="padding:0 0 4px;">
      <div class="iconbtn" onclick="confirmQuitQuiz()">✕</div>
      <h2>${c.name} · Lvl ${QZ.level}</h2>
      <div class="badge">${TIER_LABEL[q.tier]}</div>
    </div>
    <div class="quiz-top">
      <div class="qcounter">Question ${QZ.idx+1} / ${QZ.questions.length}</div>
      <div id="timer-ring" class="timer-ring"><span id="timer-num">${QZ.timeLeft}</span></div>
    </div>
    <div class="row" style="margin-bottom:6px;">
      <span class="pill">${coinIcon(15)} ${QZ.coinsEarned}${QZ.doubleActive?' (2x)':''}</span>
      <span class="pill">⚡ ${QZ.xpEarned}${QZ.xpBoostActive?' (2x)':''}</span>
      <span class="pill">Score ${QZ.score}</span>
    </div>
    <div class="card question-card">
      <div class="question-text">${escapeHtml(q.text)}</div>
      <div id="options-wrap">${optsHtml}</div>
      <div id="explain-slot"></div>
    </div>
    <div class="powerup-row">${pwRow}</div>
  </div>`;
  document.getElementById('quiz-root').innerHTML = html;
}
function selectAnswer(i){
  if(QZ.answered) return;
  QZ.answered = true;
  clearInterval(QZ.timer);
  const q = QZ.questions[QZ.idx];
  const opts = document.querySelectorAll('#options-wrap .option');
  const correct = (i===q.correct);
  if(correct){
    opts[i].classList.add('correct');
  } else {
    if(QZ.inventoryUseSecondChance){ /* handled elsewhere */ }
    opts[i] && opts[i].classList.add('wrong');
    if(opts[q.correct]) opts[q.correct].classList.add('correct');
  }
  opts.forEach(o=>o.classList.add('disabled-opt'));
  finalizeAnswer(correct, i);
}
function finalizeAnswer(correct, chosenIdx){
  const q = QZ.questions[QZ.idx];
  STATE.stats.totalQuestions += 1;
  if(correct){
    SND.correct(); vibrate(15);
    QZ.correctCount += 1;
    QZ.streak += 1;
    STATE.stats.correct += 1;
    const speedBonus = QZ.timeLeft > QZ.timeLimitBase*0.5 ? 5 : 0;
    const streakBonus = Math.min(QZ.streak*2, 20);
    const pts = TIER_BASEPTS[q.tier] + speedBonus + streakBonus;
    QZ.score += pts;
    let coins = TIER_COIN[q.tier];
    if(QZ.doubleActive) coins *= 2;
    QZ.coinsEarned += coins;
    let xpGain = Math.round(pts/2);
    if(QZ.xpBoostActive) xpGain *= 2;
    QZ.xpEarned += xpGain;
  } else {
    SND.wrong(); vibrate([20,40,20]);
    QZ.wrongCount += 1;
    QZ.streak = 0;
    STATE.stats.incorrect += 1;
  }
  document.getElementById('explain-slot').innerHTML = `<div class="explain-box">💬 ${escapeHtml(q.explanation)}</div>`;
  setTimeout(()=>{ nextQuestion(); }, 1400);
}
function handleTimeout(){
  const q = QZ.questions[QZ.idx];
  QZ.answered = true;
  QZ.wrongCount += 1;
  QZ.streak = 0;
  STATE.stats.totalQuestions += 1;
  STATE.stats.incorrect += 1;
  const opts = document.querySelectorAll('#options-wrap .option');
  opts.forEach(o=>o.classList.add('disabled-opt'));
  if(opts[q.correct]) opts[q.correct].classList.add('correct');
  SND.wrong();
  document.getElementById('explain-slot').innerHTML = `<div class="explain-box">⏱️ Time's up! ${escapeHtml(q.explanation)}</div>`;
  setTimeout(()=>{ nextQuestion(); }, 1400);
}
function nextQuestion(){
  QZ.idx += 1;
  if(QZ.idx >= QZ.questions.length){ finishLevel(); return; }
  loadQuestion();
}
function usePowerup(key){
  const q = QZ.questions[QZ.idx];
  if((STATE.inventory[key]||0)<=0 || QZ.answered) return;
  if(key==='fifty'){
    if(QZ.fiftyUsedThisQ) return;
    const wrongIdxs = [0,1,2,3].filter(i=>i!==q.correct);
    const toHide = shuffle(wrongIdxs, Math.random).slice(0,2);
    QZ.hiddenOptions = toHide;
    QZ.fiftyUsedThisQ = true;
    STATE.inventory.fifty -= 1;
    renderQuizQuestion(); updateTimerUI();
  } else if(key==='hint'){
    if(QZ.hintUsedThisQ) return;
    QZ.hintUsedThisQ = true;
    STATE.inventory.hint -= 1;
    showToast('💡 Hint: correct answer starts with "'+q.options[q.correct][0]+'"');
  } else if(key==='skip'){
    STATE.inventory.skip -= 1;
    clearInterval(QZ.timer);
    QZ.answered = true;
    saveState();
    nextQuestion();
    return;
  } else if(key==='extratime'){
    STATE.inventory.extratime -= 1;
    QZ.timeLeft += 15;
    updateTimerUI();
  } else if(key==='freeze'){
    STATE.inventory.freeze -= 1;
    QZ.frozen = true;
    showToast('❄️ Timer frozen for 5 seconds');
    setTimeout(()=>{ QZ.frozen=false; }, 5000);
  } else if(key==='secondchance'){
    STATE.inventory.secondchance -= 1;
    showToast('🔁 Second Chance ready — your next wrong answer this level will be forgiven once.');
    QZ.secondChanceAvailable = true;
  }
  saveState();
}
function confirmQuitQuiz(){
  if(confirm('Quit this level? Your progress on this attempt will be lost.')){
    clearInterval(QZ.timer);
    back();
  }
}
function finishLevel(){
  if(QZ.isDaily){ finishDailyChallenge(); return; }
  clearInterval(QZ.timer);
  const accuracy = Math.round((QZ.correctCount/QZ.questions.length)*100);
  let stars = 1;
  if(accuracy>=90) stars=3; else if(accuracy>=60) stars=2; else stars=1;
  let completionCoin = TIER_COMPLETE_COIN[tierForLevel(QZ.level)];
  if(QZ.doubleActive) completionCoin *= 2;
  let perfectBonus = 0;
  if(stars===3){ perfectBonus = 20; }
  const totalCoins = QZ.coinsEarned + completionCoin + perfectBonus;
  const totalXP = QZ.xpEarned + (QZ.xpBoostActive ? 20 : 10);

  STATE.coins += totalCoins;
  STATE.player.xp += totalXP;
  STATE.stats.totalCoinsEarned += totalCoins;
  STATE.stats.totalXPEarned += totalXP;
  STATE.stats.quizzesPlayed += 1;
  if(QZ.score > STATE.stats.highestScore) STATE.stats.highestScore = QZ.score;

  const p = STATE.progress[QZ.catId];
  const existing = p.levels[QZ.level];
  const isNewLevel = !existing;
  let newBest = existing ? Math.max(existing.bestScore, QZ.score) : QZ.score;
  let newStars = existing ? Math.max(existing.stars, stars) : stars;
  p.levels[QZ.level] = {completed:true, stars:newStars, bestScore:newBest};
  let unlockedNext = false;
  if(QZ.level === p.unlockedLevel && p.unlockedLevel < 100){
    p.unlockedLevel += 1;
    unlockedNext = true;
  }

  STATE.history.unshift({catId:QZ.catId, level:QZ.level, score:QZ.score, accuracy, date:todayStr(), correct:QZ.correctCount, wrong:QZ.wrongCount, stars});
  if(STATE.history.length>50) STATE.history.length=50;

  saveState();
  const unlockedAchievements = checkAchievements();
  goto('result', {data:{catId:QZ.catId, level:QZ.level, score:QZ.score, accuracy, correct:QZ.correctCount, wrong:QZ.wrongCount, coins:totalCoins, xp:totalXP, stars, unlockedNext, achievements:unlockedAchievements}});
  SND.level(); vibrate([10,30,10,30,10]);
}

    const name = it.name || (meta ? `${meta.name} ×${it.qty}` : it.type);
    const icon = it.icon || (meta ? meta.icon : '📦');
    const desc = it.desc || (meta ? meta.desc : '');
    const owned = it.type==='theme' ? (STATE.themesOwned.includes(it.theme) ? 'Owned' : null) : null;
    return `<div class="card store-item">
      <div class="em">${icon}</div>

      ${owned ? `<span class="badge">Owned</span>` : `<div class="buy-btn" onclick="buyItem('${it.id}')">${coinIcon(15)} ${it.price}</div>`}
    </div>`;
  }).join('');

  return `${topbar('Store')}

}
function buyItem(id){
  const it = STORE_CATALOG.find(x=>x.id===id);
  if(!it) return;
  if(it.type==='theme'){
    if(STATE.themesOwned.includes(it.theme)) return;
    if(STATE.coins < it.price){ showToast('❌ Not enough coins'); return; }
    STATE.coins -= it.price;
    STATE.themesOwned.push(it.theme);
    STATE.stats.purchases += 1;
    SND.purchase(); vibrate(20);
    showToast('✅ Purchased '+it.name);
  } else if(it.type==='frame'){
    if(!STATE.framesOwned) STATE.framesOwned = ['none'];
    if(STATE.framesOwned.includes(it.frame)) return;
    if(STATE.coins < it.price){ showToast('❌ Not enough coins'); return; }
    STATE.coins -= it.price;
    STATE.framesOwned.push(it.frame);
    STATE.stats.purchases += 1;
    SND.purchase(); vibrate(20);
    showToast('✅ Purchased '+it.name);
  } else if(it.type==='mysterybox'){
    if(STATE.coins < it.price){ showToast('❌ Not enough coins'); return; }
    STATE.coins -= it.price;
    STATE.stats.purchases += 1;
    const roll = Math.random();
    let msg;
    if(roll<0.4){ const c=randInt(Math.random,20,100); STATE.coins+=c; STATE.stats.totalCoinsEarned+=c; msg='🎁 Mystery Box: +'+c+' coins!'; }
    else if(roll<0.7){ const x=randInt(Math.random,20,80); STATE.player.xp+=x; STATE.stats.totalXPEarned+=x; msg='🎁 Mystery Box: +'+x+' XP!'; }
    else { const keys=['fifty','hint','skip','extratime','freeze']; const k=keys[Math.floor(Math.random()*keys.length)]; const q=randInt(Math.random,2,4); STATE.inventory[k]=(STATE.inventory[k]||0)+q; msg='🎁 Mystery Box: +'+q+' '+POWERUPS[k].name+'!'; }
    SND.purchase(); vibrate(20);
    showToast(msg);
  } else {
    if(STATE.coins < it.price){ showToast('❌ Not enough coins'); return; }
    STATE.coins -= it.price;
    STATE.inventory[it.type] = (STATE.inventory[it.type]||0) + (it.qty||1);
    STATE.stats.purchases += 1;
    SND.purchase(); vibrate(20);
    showToast('✅ Purchased '+(it.name || (POWERUPS[it.type]?POWERUPS[it.type].name:it.type)));
  }
  saveState();
  checkAchievements();
  render();
}

      ${['none',...STATE.framesOwned.filter(f=>f!=='none')].map(f=>`<div class="btn ${STATE.activeFrame===f?'btn-primary':'btn-secondary'}" style="font-size:13px;padding:10px;text-transform:capitalize;" onclick="setActiveFrame('${f}')">${f==='none'?'No Frame':f}</div>`).join('')}

    <div class="result-grid">
      <div class="result-stat"><div class="v">⚡ ${fmt(STATE.player.xp)}</div><div class="l">Total XP</div></div>
      <div class="result-stat"><div class="v">${coinIcon(15)} ${fmt(STATE.coins)}</div><div class="l">Total Coins</div></div>
      <div class="result-stat"><div class="v">${totalCompleted(STATE)}</div><div class="l">Levels Completed</div></div>
      <div class="result-stat"><div class="v">${fmt(s.totalQuestions)}</div><div class="l">Questions Answered</div></div>
      <div class="result-stat"><div class="v" style="color:var(--success)">${fmt(s.correct)}</div><div class="l">Correct</div></div>
      <div class="result-stat"><div class="v" style="color:var(--danger)">${fmt(s.incorrect)}</div><div class="l">Wrong</div></div>
      <div class="result-stat"><div class="v">${accuracy}%</div><div class="l">Accuracy</div></div>
      <div class="result-stat"><div class="v">🔥 ${STATE.loginStreak.current}/${STATE.loginStreak.longest}</div><div class="l">Streak/Best</div></div>
      <div class="result-stat"><div class="v">${unlockedCount}/${ACHIEVEMENTS.length}</div><div class="l">Achievements</div></div>
    </div>
    <div class="section-title">My Stuff</div>
    <div class="card profile-row" onclick="goto('achievements')"><span class="pr-icon">🏆</span><span class="pr-label">Achievements</span><span class="badge">${unlockedCount}/${ACHIEVEMENTS.length}</span><span class="pr-chevron">›</span></div>
    <div class="card profile-row" onclick="goto('statistics')"><span class="pr-icon">📊</span><span class="pr-label">Statistics</span><span class="pr-chevron">›</span></div>
    <div class="card profile-row" onclick="goto('inventory')"><span class="pr-icon">🎒</span><span class="pr-label">Inventory</span><span class="pr-chevron">›</span></div>
    <div class="card profile-row" onclick="goto('history')"><span class="pr-icon">📜</span><span class="pr-label">Quiz History</span><span class="pr-chevron">›</span></div>
    <div class="card profile-row" onclick="goto('settings')"><span class="pr-icon">⚙️</span><span class="pr-label">Settings</span><span class="pr-chevron">›</span></div>
  </div>`;
}
function setName(v){ STATE.player.name = (v||'Player').slice(0,18); saveState(); }
function setAvatar(a){ STATE.player.avatar = a; STATE.player.avatarImage = null; saveState(); render(); }
function setActiveFrame(f){ STATE.activeFrame = f; saveState(); render(); }
function clearAvatarImage(){ STATE.player.avatarImage = null; saveState(); render(); }
function handleAvatarFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('❌ Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      STATE.player.avatarImage = canvas.toDataURL('image/jpeg', 0.85);
      saveState();
      render();
      showToast('✅ Profile photo updated');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- SETTINGS ---------- */

    {id:'ocean', label:'Ocean', c1:'#3FC1FF', c2:'#00E0C7'},
    {id:'space', label:'Space', c1:'#B388FF', c2:'#FF6EC7'},
    {id:'nature', label:'Nature', c1:'#8BD450', c2:'#FFD166'},
    {id:'neon', label:'Neon', c1:'#FF2E92', c2:'#00F0FF'},
    {id:'minimal', label:'Minimal', c1:'#5C6099', c2:'#9AA0D8'},
    {id:'sunset', label:'Sunset', c1:'#FF8A5B', c2:'#FFC94A'},

    <div class="card" style="cursor:pointer;" onclick="confirmReset()"><div class="row"><span style="color:var(--danger);">🗑️ Reset All Progress</span><span>›</span></div></div>
    <div class="section-title">About</div>
    <div class="card small" style="line-height:1.7;">
      <b style="color:var(--text);">Quiz Master</b> — an offline-first quiz game. Your progress, coins, XP, achievements and settings save automatically to this device — no backup step needed, and no internet connection required to play.<br><br>
      <b style="color:var(--text);">Privacy:</b> No account or personal data is collected — everything stays on this device.
    </div>
  </div>`;
}
function toggle(key){
  return `<div class="switch ${STATE.settings[key]?'on':''}" onclick="toggleSetting('${key}')"><div class="knob"></div></div>`;
}
function toggleSetting(key){ STATE.settings[key] = !STATE.settings[key]; saveState(); SND.click(); render(); }
function toggleMode(){ STATE.settings.mode = STATE.settings.mode==='dark' ? 'light' : 'dark'; saveState(); render(); }
function setActiveTheme(id){ STATE.activeTheme = id; saveState(); render(); }
function confirmReset(){
  if(confirm('This will permanently reset your local quiz progress, coins, levels, achievements and inventory. This cannot be undone. Continue?')){
    if(confirm('Are you absolutely sure? Type OK to confirm this permanent reset.')){
      localStorage.removeItem(STORAGE_KEY);
      loadState();
      nav=[{view:'home'}];
      render();
      showToast('Progress reset.');
    }
  }
}
/* ---------- DAILY CHALLENGE ---------- */
function renderDailyChallenge(){
  const today = todayStr();
  const done = STATE.dailyChallenge.date===today && STATE.dailyChallenge.completed;
  return `${topbar('Daily Challenge')}
  <div class="screen" style="padding-top:0;">
    <div class="card" style="text-align:center;padding:26px 16px;">
      <div style="font-size:40px;">🗓️</div>
      <div class="hero-title">Today's Challenge</div>
      <div class="small" style="margin-top:6px;">10 mixed questions from all categories · Bonus coins & XP</div>
      ${done ? `<div class="unlock-banner" style="margin-top:16px;">Completed today! Score: ${STATE.dailyChallenge.score}. Come back tomorrow.</div>`
             : `<div class="btn btn-primary" style="margin-top:18px;" onclick="startDailyChallenge()">Start Challenge</div>`}
    </div>
  </div>`;
}
function startDailyChallenge(){
  const seed = hashStr('daily_'+todayStr());
  const rng = mulberry32(seed);
  const cats = shuffle(CATEGORIES, rng);
  const qs = [];
  for(let i=0;i<10;i++){
    const cat = cats[i % cats.length];
    const tier = ['beginner','easy','intermediate','hard','expert'][i % 5];
    const pool = BANK[cat.id][tier];
    const pr = mulberry32(seed+i*31);
    const src = shuffle(pool, pr)[0];
    const optIdx = shuffle([0,1,2,3], pr);
    qs.push({text:src[0], options:optIdx.map(idx=>src[1][idx]), correct:optIdx.indexOf(src[2]), explanation:src[3], tier});
  }
  QZ = {catId:'daily', level:'Daily', questions:qs, idx:0, score:0, correctCount:0, wrongCount:0, coinsEarned:0, xpEarned:0, streak:0, doubleActive:false, isDaily:true};
  goto('quiz', {catId:'daily', level:'Daily'});
}

/* ---------- DAILY REWARD ---------- */
function openDailyRewardFlow(){
  const today = todayStr();
  if(STATE.dailyReward.lastClaim === today){
    showToast('✅ Already claimed today — come back tomorrow!');
    return;
  }
  let nextDay = STATE.dailyReward.day;
  if(STATE.dailyReward.lastClaim){
    const gap = daysBetween(STATE.dailyReward.lastClaim, today);
    nextDay = (gap===1) ? (STATE.dailyReward.day % 7) + 1 : 1;
  } else { nextDay = 1; }
  const reward = DAILY_REWARD_CYCLE[nextDay-1];
  const modal = document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML = `<div class="modal" style="text-align:center;">
    <div style="font-size:40px;">🎁</div>
    <h3>Day ${nextDay} Reward</h3>
    <div class="hero-title" style="font-size:20px;">${reward.label}</div>
    <div class="spacer"></div>
    <div class="btn btn-primary btn-block" onclick="claimDailyReward(${nextDay})">Claim</div>
  </div>`;
  document.body.appendChild(modal);
}
function claimDailyReward(day){
  const reward = DAILY_REWARD_CYCLE[day-1];
  STATE.coins += reward.coins||0;
  STATE.player.xp += reward.xp||0;
  if(reward.coins) STATE.stats.totalCoinsEarned += reward.coins;
  if(reward.xp) STATE.stats.totalXPEarned += reward.xp;
  if(reward.powerup) STATE.inventory[reward.powerup] = (STATE.inventory[reward.powerup]||0) + reward.qty;
  if(reward.extra) STATE.inventory[reward.extra.powerup] = (STATE.inventory[reward.extra.powerup]||0) + reward.extra.qty;
  STATE.dailyReward.lastClaim = todayStr();
  STATE.dailyReward.day = day;
  saveState();
  document.querySelector('.modal-bg').remove();
  SND.coin(); vibrate(15);
  showToast('🎉 Claimed: '+reward.label);
  checkAchievements();
  render();
}
function renderDailyRewardModalPage(){ return renderHome(); }

/* ---------- HISTORY ---------- */
function renderHistory(){
  if(!STATE.history.length) return `${topbar('Quiz History')}<div class="screen">${emptyState('📜','No quiz history yet. Play a level to see it here!')}</div>`;
  let rows = STATE.history.map(h=>{
    const c = CATEGORIES.find(x=>x.id===h.catId) || {name:'Daily Challenge', icon:'🗓️'};
    return `<div class="card" style="margin-bottom:9px;">
      <div class="row"><span style="font-weight:800;">${c.icon} ${c.name} · Lvl ${h.level}</span><span>${'★'.repeat(h.stars)}${'☆'.repeat(3-h.stars)}</span></div>
      <div class="small" style="margin-top:4px;">${h.date} · Score ${h.score} · ${h.accuracy}% accuracy · ${h.correct}✓ / ${h.wrong}✗</div>
    </div>`;
  }).join('');
  return `${topbar('Quiz History')}<div class="screen" style="padding-top:0;">${rows}</div>`;
}

function emptyState(emoji, text){
  return `<div class="emptystate"><span class="em">${emoji}</span>${text}</div>`;
}

/* ---------- Daily challenge finish ---------- */
function finishDailyChallenge(){
  clearInterval(QZ.timer);
  const accuracy = Math.round((QZ.correctCount/QZ.questions.length)*100);
  const coins = 40 + QZ.coinsEarned;
  const xp = 30 + QZ.xpEarned;
  STATE.coins += coins;
  STATE.player.xp += xp;
  STATE.stats.totalCoinsEarned += coins;
  STATE.stats.totalXPEarned += xp;
  STATE.stats.quizzesPlayed += 1;
  STATE.stats.dailyChallengesDone += 1;
  STATE.dailyChallenge = {date:todayStr(), completed:true, score:QZ.score};
  const stars = accuracy>=90?3:accuracy>=60?2:1;
  STATE.history.unshift({catId:'daily', level:'Daily', score:QZ.score, accuracy, date:todayStr(), correct:QZ.correctCount, wrong:QZ.wrongCount, stars});
  if(STATE.history.length>50) STATE.history.length=50;
  saveState();
  const ach = checkAchievements();
  SND.level();
  goto('result', {data:{catId:'daily', level:'Daily', score:QZ.score, accuracy, correct:QZ.correctCount, wrong:QZ.wrongCount, coins, xp, stars, unlockedNext:false, achievements:ach}});
}
